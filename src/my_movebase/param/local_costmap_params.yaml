# local_costmap_params.yaml
local_costmap:
  global_frame: odom
  robot_base_frame: base_link
  update_frequency: 10.0
  publish_frequency: 10.0  # Increased for better visualization
  transform_tolerance: 1.0  # Increased to handle potential TF delays
  
  static_map: false
  rolling_window: true
  width: 4.0  # Increased width
  height: 4.0  # Increased height
  resolution: 0.05
  
  plugins:
    - {name: obstacle_layer, type: "costmap_2d::ObstacleLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}
  
  obstacle_layer:
    enabled: true
    observation_sources: laser_scan_sensor
    laser_scan_sensor: {
      sensor_frame: base_laser,  # VERIFY THIS IS YOUR ACTUAL LASER FRAME
      data_type: LaserScan, 
      topic: scan,  # VERIFY THIS IS YOUR ACTUAL LASER TOPIC
      marking: true, 
      clearing: true,
      expected_update_rate: 0.0,  # Added to not require constant updates
      obstacle_range: 3.5,
      raytrace_range: 4.0,
      min_obstacle_height: -1.0,  # Set to negative to ensure no height filtering
      max_obstacle_height: 2.0
    }
    track_unknown_space: true  # Added to track unknown space
    combination_method: 1  # 1=Maximum, overlay obstacles on map
  
  inflation_layer:
    enabled: true
    inflation_radius: 0.4
    cost_scaling_factor: 5.0